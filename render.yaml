# Render Blueprint — GitHub 저장소를 연결하면 이 파일대로 서비스가 만들어집니다.
# Express가 API와 프론트(public/)를 함께 서빙하므로 서비스는 1개면 충분합니다.
# 데이터는 Supabase(PostgreSQL)에 저장되므로 재시작/재배포/잠들었다 깨어나도 유지됩니다.
services:
  - type: web
    name: gbsa-reminder
    runtime: node
    plan: free
    region: singapore          # 한국에서 가장 가까운 Render 리전
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true    # 로그인 세션 서명 키(랜덤 생성). 접근 인증은 사번 로그인으로 일원화됨(HTTP Basic 제거)
      - key: SUPABASE_URL
        sync: false            # 값은 Render 대시보드에서 직접 입력 (저장소에 넣지 않음)
      - key: SUPABASE_KEY
        sync: false            # service_role 키 — 대시보드에서 직접 입력
